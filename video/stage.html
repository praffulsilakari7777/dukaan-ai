<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dukaan AI demo stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --brand: #0f766e; --brand-400: #14b8a6; --brand-900: #0a4f49; --brand-950: #06302d; --ink: #102320; --ink-3: #6f7f7a; --good: #15803d; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: #fff;
    background:
      radial-gradient(1200px 800px at 78% 40%, rgba(20, 184, 166, 0.22), transparent 60%),
      radial-gradient(900px 700px at 10% 100%, rgba(21, 128, 61, 0.18), transparent 60%),
      var(--brand-950);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, transparent 159px, rgba(255,255,255,0.05) 159px, rgba(255,255,255,0.05) 160px, transparent 160px),
      repeating-linear-gradient(180deg, transparent 0 47px, rgba(255,255,255,0.035) 47px 48px);
  }
  .brand { position: absolute; top: 56px; left: 200px; display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 26px; letter-spacing: -0.02em; z-index: 3; }
  .brand small { font-weight: 500; font-size: 16px; color: rgba(255,255,255,0.6); margin-left: 6px; }

  .caption { position: absolute; left: 200px; top: 0; bottom: 0; width: 760px; display: flex; flex-direction: column; justify-content: center; z-index: 2; transition: opacity 0.5s, transform 0.5s; }
  .caption.out { opacity: 0; transform: translateY(14px); }
  .step { display: inline-flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand-400); margin-bottom: 26px; }
  .step i { width: 40px; height: 2px; background: var(--brand-400); display: block; }
  .caption h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -0.04em; }
  .caption p { font-size: 27px; line-height: 1.45; color: rgba(255,255,255,0.74); margin-top: 28px; max-width: 680px; }
  .tags { display: flex; gap: 12px; margin-top: 36px; flex-wrap: wrap; }
  .tag { font-size: 17px; font-weight: 600; padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: rgba(255,255,255,0.88); }
  .tag b { color: var(--brand-400); }

  .phone {
    position: absolute; right: 250px; top: 50%;
    width: 462px; height: 960px; margin-top: -480px;
    border-radius: 66px; padding: 14px;
    background: linear-gradient(145deg, #1e2a28, #070d0c);
    box-shadow: 0 0 0 2px #2c3b38, 0 50px 120px rgba(0,0,0,0.55), inset 0 0 0 2px #0b1211;
    transition: transform 0.8s cubic-bezier(.22,1,.36,1), opacity 0.6s;
    z-index: 2;
  }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #f4f6f5; }
  .phone iframe { position: absolute; top: 46px; left: 0; width: 394px; height: 805px; border: 0; transform: scale(1.1); transform-origin: 0 0; }
  .phone .status { position: absolute; top: 0; left: 0; right: 0; height: 46px; background: #0f766e; color: #fff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px; }
  .phone .status svg { display: block; }
  .phone .notch { position: absolute; top: 10px; left: 50%; width: 120px; height: 34px; margin-left: -60px; background: #070d0c; border-radius: 20px; z-index: 5; }
  .phone.away { transform: translateX(120px) scale(0.92); opacity: 0; }

  .desk {
    position: absolute; left: 50%; top: 50%; width: 1600px; height: 980px; margin: -490px 0 0 -800px;
    border-radius: 18px; overflow: hidden; background: #fff;
    box-shadow: 0 50px 140px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
    transform: translateY(60px) scale(0.96); opacity: 0; transition: transform 0.9s cubic-bezier(.22,1,.36,1), opacity 0.6s;
    z-index: 4; pointer-events: none;
  }
  .desk.in { transform: none; opacity: 1; pointer-events: auto; }
  .desk .bar { height: 44px; background: #eef2f1; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid #dde4e2; }
  .desk .bar i { width: 12px; height: 12px; border-radius: 50%; background: #d4dbd9; }
  .desk .bar span { margin-left: 18px; flex: 0 0 520px; height: 28px; border-radius: 8px; background: #fff; color: #6f7f7a; font-size: 14px; display: flex; align-items: center; padding: 0 12px; }
  .desk iframe { width: 1600px; height: 936px; border: 0; display: block; }

  .card {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    z-index: 6; background: var(--brand-950); transition: opacity 0.7s;
  }
  .card.hide { opacity: 0; pointer-events: none; }
  .card .logo { width: 112px; height: 112px; margin-bottom: 36px; }
  .card h1 { font-size: 112px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
  .card h2 { font-size: 40px; font-weight: 500; color: rgba(255,255,255,0.78); margin-top: 22px; letter-spacing: -0.01em; }
  .card .stat { display: flex; gap: 70px; margin-top: 64px; }
  .card .stat div { text-align: left; }
  .card .stat b { display: block; font-size: 56px; font-weight: 800; color: var(--brand-400); letter-spacing: -0.03em; }
  .card .stat span { font-size: 20px; color: rgba(255,255,255,0.6); }
  .card .foot { position: absolute; bottom: 64px; font-size: 20px; color: rgba(255,255,255,0.5); }
  .card .foot b { color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <div class="brand">
    <svg width="42" height="42" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#0f766e"/><path d="M9 17.5h22l-2 13.5a2 2 0 0 1-2 1.7H13a2 2 0 0 1-2-1.7z" fill="#fff"/><path d="M14.5 17.5c0-4.2 2.4-7.5 5.5-7.5s5.5 3.3 5.5 7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M15.5 24.5h9M15.5 28h6" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/></svg>
    Dukaan AI <small>Google Cloud AI Builder Cup 2026</small>
  </div>

  <section class="caption" id="caption">
    <div class="step" id="step"><i></i><span></span></div>
    <h1 id="title"></h1>
    <p id="body"></p>
    <div class="tags" id="tags"></div>
  </section>

  <div class="phone" id="phone">
    <div class="screen"><div class="status"><span>9:41</span><svg width="66" height="14" viewBox="0 0 66 14" fill="#fff"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M30 4.5a9 9 0 0 1 12 0l-1.5 1.6a6.8 6.8 0 0 0-9 0zM33 7.7a4.6 4.6 0 0 1 6 0L36 11z"/><rect x="46" y="1" width="18" height="12" rx="3" fill="none" stroke="#fff" stroke-width="1.4"/><rect x="48" y="3" width="12" height="8" rx="1.5"/></svg></div><div class="notch"></div><iframe id="app" src="about:blank" title="Dukaan AI"></iframe></div>
  </div>

  <div class="desk" id="desk">
    <div class="bar"><i></i><i></i><i></i><span>dukaan-ai.run.app</span></div>
    <iframe id="deskapp" src="about:blank" title="Dukaan AI desktop"></iframe>
  </div>

  <div class="card" id="card">
    <svg class="logo" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#0f766e"/><path d="M9 17.5h22l-2 13.5a2 2 0 0 1-2 1.7H13a2 2 0 0 1-2-1.7z" fill="#fff"/><path d="M14.5 17.5c0-4.2 2.4-7.5 5.5-7.5s5.5 3.3 5.5 7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M15.5 24.5h9M15.5 28h6" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/></svg>
    <h1 id="cardTitle">Dukaan AI</h1>
    <h2 id="cardSub">An AI employee for India’s kirana stores</h2>
    <div class="stat" id="cardStat"></div>
    <div class="foot" id="cardFoot"></div>
  </div>

<script>
  window.stage = {
    caption({ step, title, body, tags = [] }) {
      const c = document.getElementById('caption');
      c.classList.add('out');
      setTimeout(() => {
        document.querySelector('#step span').textContent = step;
        document.getElementById('title').innerHTML = title;
        document.getElementById('body').textContent = body;
        document.getElementById('tags').innerHTML = tags.map((t) => `<span class="tag">${t}</span>`).join('');
        c.classList.remove('out');
      }, 420);
    },
    card({ title, sub, stats = [], foot = '' }) {
      const c = document.getElementById('card');
      document.getElementById('cardTitle').innerHTML = title;
      document.getElementById('cardSub').innerHTML = sub;
      document.getElementById('cardStat').innerHTML = stats.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join('');
      document.getElementById('cardFoot').innerHTML = foot;
      c.classList.remove('hide');
    },
    hideCard() { document.getElementById('card').classList.add('hide'); },
    desktop(on) {
      document.getElementById('desk').classList.toggle('in', on);
      document.getElementById('phone').classList.toggle('away', on);
      document.getElementById('caption').classList.toggle('out', on);
    },
  };
</script>
</body>
</html>
